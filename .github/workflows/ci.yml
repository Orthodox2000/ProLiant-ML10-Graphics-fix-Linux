name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          fail=0
          for f in scripts/linux/*.sh scripts/freebsd/*.sh scripts/doc/*.sh install.sh; do
            if bash -n "$f"; then echo "OK   $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning
        continue-on-error: true

  build-windows:
    name: Build DisplayFix.exe (mingw-w64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Build
        run: |
          x86_64-w64-mingw32-gcc -O2 -municode -o DisplayFix.exe \
            scripts/windows/src/DisplayFix.c -luser32 -lgdi32 -lshell32
          file DisplayFix.exe
          sha256sum DisplayFix.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DisplayFix-exe
          path: DisplayFix.exe

  build-pdf:
    name: Build documentation PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install python3-markdown
        run: python3 -m pip install --user markdown

      - name: Build PDF
        run: bash scripts/doc/build-pdf.sh

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: ProLiant-ML10-Graphics-fix-pdf
          path: docs/dist/ProLiant-ML10-Graphics-fix.pdf
