<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
    <style>
      .box { fill:#f8f9fa; stroke:#343a40; stroke-width:1.5; rx:8; }
      .hw  { fill:#e7f1ff; stroke:#0d6efd; }
      .sw  { fill:#e9f7ef; stroke:#198754; }
      .bad { fill:#fdecea; stroke:#dc3545; }
      .good{ fill:#e9f7ef; stroke:#198754; }
      .t   { font-size:14px; fill:#212529; }
      .h   { font-size:16px; font-weight:600; fill:#212529; }
      .sm  { font-size:12px; fill:#495057; }
      .lbl { font-size:12px; fill:#0d6efd; }
    </style>
  </defs>

  <text x="20" y="32" class="h" font-size="20">HP ProLiant ML10 Gen9 — display signal chain &amp; failure points</text>

  <!-- signal chain -->
  <rect class="box hw" x="20"  y="60" width="150" height="70"/>
  <text x="95" y="88" class="t" text-anchor="middle">Intel HD</text>
  <text x="95" y="108" class="t" text-anchor="middle">Graphics P530</text>

  <rect class="box hw" x="210" y="60" width="150" height="70"/>
  <text x="285" y="88" class="t" text-anchor="middle">DP++ port</text>
  <text x="285" y="108" class="sm" text-anchor="middle">DDI B/C — DP or TMDS</text>

  <rect class="box bad" x="400" y="60" width="170" height="70"/>
  <text x="485" y="84" class="t" text-anchor="middle">DP→DVI→HDMI</text>
  <text x="485" y="103" class="sm" text-anchor="middle">passive adapter</text>
  <text x="485" y="119" class="sm" text-anchor="middle">✗ drops EDID / DDC</text>

  <rect class="box hw" x="610" y="60" width="150" height="70"/>
  <text x="685" y="98" class="t" text-anchor="middle">Monitor (HDMI)</text>

  <line x1="170" y1="95" x2="208" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="95" x2="398" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="95" x2="608" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- two names -->
  <rect class="box" x="20" y="180" width="340" height="120"/>
  <text x="35" y="205" class="h">One port, two connector names</text>
  <rect class="box sw" x="40" y="220" width="130" height="34"/>
  <text x="105" y="242" class="t" text-anchor="middle">DP-1</text>
  <rect class="box sw" x="200" y="220" width="130" height="34"/>
  <text x="265" y="242" class="t" text-anchor="middle">HDMI-A-1</text>
  <text x="35" y="278" class="sm">Force only the one matching the cable.</text>
  <text x="35" y="294" class="sm">Forcing both → encoder conflict → black screen.</text>
  <line x1="170" y1="237" x2="198" y2="237" stroke="#198754" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- kernel cmdline -->
  <rect class="box" x="390" y="180" width="360" height="120"/>
  <text x="405" y="205" class="h">Linux: kernel command line</text>
  <text x="405" y="230" class="sm" font-family="monospace">remove:  nomodeset</text>
  <text x="405" y="252" class="sm" font-family="monospace">add:     video=HDMI-A-1:1366x768@60e</text>
  <text x="405" y="274" class="sm" font-family="monospace">         i915.enable_dc=0 ... (stability)</text>

  <!-- outcomes -->
  <rect class="box bad" x="20" y="330" width="270" height="110"/>
  <text x="155" y="356" class="h" text-anchor="middle">With nomodeset</text>
  <text x="155" y="382" class="t" text-anchor="middle">i915 not loaded</text>
  <text x="155" y="402" class="t" text-anchor="middle">simpledrm</text>
  <text x="155" y="424" class="t" text-anchor="middle">fixed 1024×768, no accel</text>

  <rect class="box good" x="330" y="330" width="300" height="110"/>
  <text x="480" y="356" class="h" text-anchor="middle">With nomodeset removed</text>
  <text x="480" y="382" class="t" text-anchor="middle">i915 + video= force</text>
  <text x="480" y="402" class="t" text-anchor="middle">EDID not needed</text>
  <text x="480" y="424" class="t" text-anchor="middle">1366×768 @ 60 Hz, Mesa</text>

  <rect class="box good" x="670" y="330" width="270" height="110"/>
  <text x="805" y="356" class="h" text-anchor="middle">Hardware alternative</text>
  <text x="805" y="382" class="t" text-anchor="middle">active DP→HDMI adapter</text>
  <text x="805" y="402" class="t" text-anchor="middle">regenerates DDC/EDID</text>
  <text x="805" y="424" class="t" text-anchor="middle">works on every OS</text>

  <line x1="155" y1="300" x2="155" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="300" x2="480" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="237" x2="700" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="490" class="h">Root cause in one line</text>
  <rect class="box" x="20" y="505" width="920" height="95"/>
  <text x="40" y="532" class="t">A passive DP→DVI→HDMI chain hides the monitor’s EDID (GMBUS read fails).</text>
  <text x="40" y="554" class="t">Without EDID the driver never enables the output → “no signal”; nomodeset just hides it behind a 1024×768 framebuffer.</text>
  <text x="40" y="576" class="t">Fix: skip EDID entirely with video=&lt;connector&gt;:&lt;mode&gt;e, or use an active adapter that restores EDID.</text>
</svg>
